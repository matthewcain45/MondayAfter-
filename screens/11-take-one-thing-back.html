<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take one thing back</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#E8EDF3;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0 24px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.08em;color:#9AA7B8;text-transform:uppercase"><span>The Monday After · Your move</span><span>5 of 5</span></div>
  <div style="margin:12px 24px 0 24px;height:3px;background:#2A3647;border-radius:2px"><div style="width:100%;height:3px;background:#FFB020;border-radius:2px"></div></div>
  <div style="flex:1;padding:22px 24px 22px 24px;display:flex;flex-direction:column;gap:10px">
    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:600">Take one thing back.</h1>
    <p style="margin:0 0 4px 0;font-size:14px;line-height:1.4;color:#9AA7B8">You flagged three. Pick the one you’ll actually do. One is enough.</p>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:12px 14px;text-align:left;border:2px solid #FFB020;border-radius:12px;background:#1E2B3C;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #FFB020;display:flex;align-items:center;justify-content:center"><span style="width:8px;height:8px;border-radius:50%;background:#FFB020"></span></span><span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Ask who should have checked the agency’s payroll provider.</span><span style="display:block;margin-top:3px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:0.06em;color:#9AA7B8;text-transform:uppercase">From: Who should have checked?</span></span></button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:12px 14px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #2A3647"></span><span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Map who is paid through the same chain as your incident team.</span><span style="display:block;margin-top:3px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:0.06em;color:#9AA7B8;text-transform:uppercase">From: Dependency</span></span></button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:12px 14px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #2A3647"></span><span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Find out whether anyone has read the agency contract.</span><span style="display:block;margin-top:3px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:0.06em;color:#9AA7B8;text-transform:uppercase">From: Reveal 1, press the agency</span></span></button>
    <div style="margin-top:4px;padding:14px 16px;border:1px solid #2A3647;border-radius:14px;background:#17212F;display:flex;flex-direction:column;gap:10px">
      <div style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.1em;color:#FFB020">BY WHEN</div>
      <div style="display:flex;gap:8px">
        <span style="flex:1;text-align:center;padding:8px 0;border:1px solid #2A3647;border-radius:10px;font-size:13.5px;color:#B7C2D0">1 week</span>
        <span style="flex:1;text-align:center;padding:8px 0;border:2px solid #FFB020;border-radius:10px;background:#1E2B3C;font-size:13.5px;font-weight:600">2 weeks</span>
        <span style="flex:1;text-align:center;padding:8px 0;border:1px solid #2A3647;border-radius:10px;font-size:13.5px;color:#B7C2D0">1 month</span>
      </div>
      <label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4;color:#C5CEDA"><span style="flex:none;margin-top:1px;width:16px;height:16px;border-radius:4px;background:#FFB020;color:#0E1621;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">✓</span><span>Ask me in 30 days whether I did it. One email, and you can stop it any time.</span></label>
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
      <button style="display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:12px;background:#FFB020;color:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer">Save and close the file →</button>
      <button style="display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:1px solid #FFB020;border-radius:12px;background:transparent;color:#FFB020;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer">Skip, close the file</button>
    </div>
  </div>
</div>

</body>
</html>
