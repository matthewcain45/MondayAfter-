<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision 2: your adjustment</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#E8EDF3;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0 24px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.08em;color:#9AA7B8;text-transform:uppercase"><span>The Monday After</span><span style="white-space:nowrap">4 of 5 · ●●○○</span></div>
  <div style="margin:12px 24px 0 24px;height:3px;background:#2A3647;border-radius:2px"><div style="width:80%;height:3px;background:#FFB020;border-radius:2px"></div></div>
  <div style="flex:1;padding:22px 24px 24px 24px;display:flex;flex-direction:column;gap:8px">
    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:600">Your adjustment.</h1>
    <p style="margin:0 0 4px 0;font-size:14px;line-height:1.4;color:#9AA7B8">Pick one.</p>
    <div style="margin-bottom:2px;padding:8px 12px;border:1px solid #2A3647;border-radius:10px;background:#17212F;font-size:12.5px;line-height:1.4;color:#FFB020">Because you built the list, bridging is possible.</div>
    <button style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px dashed #5CE0C0;border-radius:12px;background:transparent;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><span style="display:block"><span style="display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:0.1em;color:#5CE0C0">SATURDAY, 14:00 · PULL A THREAD</span><span style="display:block;margin-top:2px;font-size:14px;font-weight:500;line-height:1.3">A neighbour will pay its contractors directly</span><span style="display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:#B7C2D0">Your workers have seen it.</span></span><span style="flex:none;color:#5CE0C0;font-size:16px" aria-hidden="true">↗</span></button>

    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:2px solid #FFB020;border-radius:12px;background:#1E2B3C;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#FFB020;color:#0E1621;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">1</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Bridge the most exposed.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Arrange emergency payments for the workers who depend on this pay.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">2</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Tell the workers the truth.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Say what you know and what you don't, before the group chat does it for you.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">3</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Escalate for a policy call.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Ask the CEO whether to pay workers directly, suspend the agency, or hold.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">4</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Find out what else is at risk.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Who else does this provider serve, and what can its people get to on your side?</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">5</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Plan Monday without them.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Rota, priorities, what you'll stop doing.</span></span>
    </button>

    <div style="margin-top:auto;padding-top:12px">
      <button style="display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:12px;background:#FFB020;color:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer">Lock in</button>
    </div>
  </div>
</div>

</body>
