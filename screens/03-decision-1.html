<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision 1: your first move</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#E8EDF3;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0 24px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.08em;color:#9AA7B8;text-transform:uppercase"><span>Incident File 01 · The Monday After</span><span>2 of 5</span></div>
  <div style="margin:12px 24px 0 24px;height:3px;background:#2A3647;border-radius:2px"><div style="width:40%;height:3px;background:#FFB020;border-radius:2px"></div></div>
  <div style="flex:1;padding:22px 24px 24px 24px;display:flex;flex-direction:column;gap:8px">
    <h1 style="margin:0;font-size:28px;line-height:1.15;font-weight:600">Your first move.</h1>
    <p style="margin:0 0 8px 0;font-size:14px;line-height:1.4;color:#9AA7B8">Pick one or two. You'll lock in before you see anything.</p>

    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:2px solid #FFB020;border-radius:12px;background:#1E2B3C;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#FFB020;color:#0E1621;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">A</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Build the list.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Find out who these workers are, where they sit, and who is most exposed.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:2px solid #FFB020;border-radius:12px;background:#1E2B3C;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#FFB020;color:#0E1621;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">B</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Press the agency.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Use the contract to demand facts and a date.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">C</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Bridge the gap.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Arrange emergency payments to the most exposed workers.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">D</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Tell the workers now.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">A short, honest message saying you don't yet know.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">E</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Talk to the unions and worker reps early.</span></span>
    </button>
    <button style="display:flex;gap:12px;align-items:flex-start;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px solid #2A3647;border-radius:12px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:28px;height:28px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">F</span>
      <span style="display:block"><span style="display:block;font-size:15px;font-weight:600;line-height:1.3">Protect the critical work.</span><span style="display:block;font-size:12.5px;line-height:1.35;color:#B7C2D0">Ask managers where the service leans on these workers, and plan for absences.</span></span>
    </button>

    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px">
      <div style="text-align:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.08em;color:#9AA7B8">2 OF 2 PICKED</div>
      <button style="display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:12px;background:#FFB020;color:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer">Lock in</button>
    </div>
  </div>
</div>

</body>
</html>
