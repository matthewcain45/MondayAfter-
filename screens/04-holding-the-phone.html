<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's holding the phone?</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>

</head>
<body>


<div style="width:390px;height:844px;box-sizing:border-box;background:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#E8EDF3;display:flex;flex-direction:column">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0 24px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.08em;color:#9AA7B8;text-transform:uppercase"><span>The Monday After</span><span style="white-space:nowrap">2 of 5 · ○○○○</span></div>
  <div style="margin:12px 24px 0 24px;height:3px;background:#2A3647;border-radius:2px"><div style="width:40%;height:3px;background:#FFB020;border-radius:2px"></div></div>
  <div style="flex:1;padding:22px 24px 24px 24px;display:flex;flex-direction:column;gap:12px">
    <div style="padding:10px 14px;border:1px solid #2A3647;border-radius:12px;background:#17212F;display:flex;flex-direction:column;gap:4px">
      <div style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:0.1em;color:#9AA7B8">YOUR ROUTE SO FAR</div>
      <div style="font-size:13.5px;line-height:1.4;color:#C5CEDA">Build the list · Press the agency</div>
    </div>
    <h1 style="margin:8px 0 0 0;font-size:28px;line-height:1.15;font-weight:600">Who's holding the phone?</h1>
    <p style="margin:0 0 8px 0;font-size:14px;line-height:1.4;color:#9AA7B8">You chose to press the agency. The contract sits with HR. IT has never seen it. Choose one.</p>

    <button style="display:flex;gap:14px;align-items:flex-start;width:100%;box-sizing:border-box;padding:16px;text-align:left;border:1px solid #2A3647;border-radius:14px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:32px;height:32px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">B1</span>
      <span style="display:block"><span style="display:block;font-size:16px;font-weight:600;line-height:1.3">HR leads, IT supports.</span><span style="display:block;margin-top:4px;font-size:13px;line-height:1.4;color:#B7C2D0">The contract owner makes the call.</span></span>
    </button>
    <button style="display:flex;gap:14px;align-items:flex-start;width:100%;box-sizing:border-box;padding:16px;text-align:left;border:2px solid #FFB020;border-radius:14px;background:#1E2B3C;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:32px;height:32px;border-radius:8px;background:#FFB020;color:#0E1621;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">B2</span>
      <span style="display:block"><span style="display:block;font-size:16px;font-weight:600;line-height:1.3">HR asks for your help, and you step in alongside.</span><span style="display:block;margin-top:4px;font-size:13px;line-height:1.4;color:#B7C2D0">You work the problem together.</span></span>
    </button>
    <button style="display:flex;gap:14px;align-items:flex-start;width:100%;box-sizing:border-box;padding:16px;text-align:left;border:1px solid #2A3647;border-radius:14px;background:#17212F;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer">
      <span style="flex:none;width:32px;height:32px;border-radius:8px;background:#2A3647;color:#E8EDF3;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;font-weight:500">B3</span>
      <span style="display:block"><span style="display:block;font-size:16px;font-weight:600;line-height:1.3">You take the lead.</span><span style="display:block;margin-top:4px;font-size:13px;line-height:1.4;color:#B7C2D0">You pull it from HR because you think they can't handle it.</span></span>
    </button>

    <p style="margin:8px 0 0 0;font-size:13px;line-height:1.45;color:#9AA7B8">No right answer. Each one leaves something behind.</p>
    <button style="display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:10px 12px;text-align:left;border:1px dashed #5CE0C0;border-radius:12px;background:transparent;color:#E8EDF3;font-family:'IBM Plex Sans',system-ui,sans-serif;cursor:pointer"><span style="display:block"><span style="display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:0.1em;color:#5CE0C0">PULL A THREAD · 1 MIN</span><span style="display:block;margin-top:2px;font-size:14px;font-weight:500;line-height:1.3">Are you owning this?</span><span style="display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:#B7C2D0">Shown only if you chose to press the agency.</span></span><span style="flex:none;color:#5CE0C0;font-size:16px" aria-hidden="true">↗</span></button>

    <div style="margin-top:auto">
      <button style="display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:12px;background:#FFB020;color:#0E1621;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;font-weight:600;cursor:pointer">Lock in</button>
    </div>
  </div>
</div>

</body>
</html>
