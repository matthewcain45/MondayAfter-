# One-off setup, uploaded by the owner in the AWS console (CloudFormation),
# in The Monday After account only. It lets this GitHub project's "Deploy"
# and "Export" buttons get short-lived access to that account. No passwords
# or keys are stored anywhere: GitHub proves who it is each time, and the
# access ends after an hour at most.

AWSTemplateFormatVersion: "2010-09-09"
Description: Lets The Monday After's GitHub buttons deploy to this account, with no stored keys and only the permissions they need.

Parameters:
  GitHubRepository:
    Type: String
    Default: matthewcain45@348284796/MondayAfter-@1434344225
    Description: >-
      The GitHub project allowed to deploy, as GitHub identifies it to AWS:
      owner@ownerId/name@projectId. The ID numbers never change, so a project
      created later with the same name can't pass as this one.
  AllowedBranch:
    Type: String
    Default: main
    Description: Only buttons run from this branch get access. Changes reach it only when the owner approves them.

Resources:
  GitHubSignIn:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: tma-github-deploy
      Description: Used only by The Monday After's GitHub Deploy and Export buttons.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubSignIn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringEqualsIgnoreCase:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${AllowedBranch}
                # Shown by the "Show GitHub's sign-in details" step of the Deploy button.
      # Only what the four buttons need (narrowed after the first build, as
      # agreed in the security review). Everything else is refused.
      Policies:
        - PolicyName: tma-github-buttons
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Deploy: hand over to AWS CDK's own deployment roles, created once
              # when the account was first prepared ("bootstrapped").
              - Sid: Deploy
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*
              # Request web address certificate, and Deploy looking it up.
              - Sid: Certificate
                Effect: Allow
                Action:
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - acm:RequestCertificate
                  - acm:AddTagsToCertificate
                Resource: "*"
              # Send Incident File and Export spreadsheets.
              - Sid: Buttons
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !Sub arn:aws:lambda:eu-west-2:${AWS::AccountId}:function:tma-*-sender
                  - !Sub arn:aws:lambda:eu-west-2:${AWS::AccountId}:function:tma-*-export
              # Export: find the name of the private bucket the files went to.
              - Sid: ReadOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:eu-west-2:${AWS::AccountId}:stack/TheMondayAfter-*/*

Outputs:
  RoleArn:
    Description: Copy this into GitHub as the variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
