# The "Send Incident File" button. Emails every confirmed reader their own
# personal link. Type SEND in the box to confirm: it can't be undone.
name: Send Incident File (test copy)

on:
  workflow_dispatch:
    inputs:
      file:
        description: Which file to send
        required: true
        default: incident-file-01
      confirm:
        description: Type SEND to confirm
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check this is the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this button from the main branch: choose main under 'Use workflow from'. AWS only accepts the main branch."
          exit 1

      - name: Check confirmation
        if: ${{ github.event.inputs.confirm != 'SEND' }}
        run: |
          echo "Not sent: type SEND in the confirm box to send." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Sign in to AWS (short-lived)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Send
        env:
          FILE_ID: ${{ github.event.inputs.file }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -o pipefail # a failure below still turns the run red
          case "$FILE_ID" in *[!a-z0-9-]*|"") echo "Bad file name"; exit 1;; esac
          aws lambda invoke --function-name tma-test-sender --cli-read-timeout 320 \
            --cli-binary-format raw-in-base64-out --payload "{\"scenarioId\":\"$FILE_ID\",\"requestedBy\":\"$RUN_ID\"}" result.json > /dev/null
          node -e '
            const r = require("./result.json");
            const rates = "- Bounce rate: " + r.bounceRate + " (limit 4%)\n- Complaint rate: " + r.complaintRate + " (limit 0.08%)";
            if (r.blocked) {
              console.log("## Not sent: sending is paused for safety\n\n" + r.reasons.map((x) => "- " + x).join("\n") + "\n\n" + rates + "\n\nNothing was sent. Ask Claude to help look into it before trying again.");
              process.exit(1);
            }
            if (typeof r.sent !== "number") { console.error("Send failed:", JSON.stringify(r)); process.exit(1); }
            console.log("## Sent\n\n- Sent: " + r.sent + "\n- Failed: " + r.failed + "\n\n### Sending health, checked before sending\n\n" + rates);
            if (r.failed) console.log("\nA few failures can be addresses AWS refuses to email (for example, ones that bounced before). Ask Claude if there are more than one or two.");
          ' | tee -a "$GITHUB_STEP_SUMMARY"
