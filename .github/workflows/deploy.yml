# The "Deploy" button. Run it from the Actions tab on GitHub.
# It runs every check first, and stops if any fail, before changing anything on AWS.
name: Deploy test copy

on:
  workflow_dispatch:

permissions:
  id-token: write # lets GitHub prove who it is to AWS (no stored keys)
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check this is the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this button from the main branch: choose main under 'Use workflow from'. AWS only accepts the main branch."
          exit 1

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install tools
        run: |
          npm ci --prefix backend
          npm ci --prefix infra

      - name: Run all checks
        run: |
          npm test --prefix backend
          npm run typecheck --prefix backend
          npm test --prefix infra
          npm run typecheck --prefix infra
          node scripts/check-scenario.mjs incident-file-01

      # Shows the details GitHub presents to AWS (who, which project, which branch),
      # so they can be matched to the trust setting. Never prints the pass itself.
      - name: Show GitHub's sign-in details
        continue-on-error: true
        run: |
          node -e '
            const url = process.env.ACTIONS_ID_TOKEN_REQUEST_URL + "&audience=sts.amazonaws.com";
            fetch(url, { headers: { authorization: "bearer " + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } })
              .then((r) => r.json())
              .then((j) => {
                const c = JSON.parse(Buffer.from(j.value.split(".")[1], "base64url").toString());
                const lines = ["sub: " + c.sub, "aud: " + c.aud, "repository: " + c.repository, "ref: " + c.ref];
                console.log(lines.join("\n"));
                require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Sign-in details\n\n```\n" + lines.join("\n") + "\n```\n");
              });
          '

      - name: Sign in to AWS (short-lived)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      # The account was prepared for CDK ("bootstrapped") on the first deploy. The
      # buttons' narrowed permissions can't redo that; if a future CDK upgrade
      # ever asks for it, it's a one-off job to plan with the owner.

      # Once the "Request web address certificate" button's certificate is issued,
      # the site switches to its own address. Until then it keeps the temporary one.
      - name: Look for the web address certificate
        id: cert
        run: |
          arn=$(aws acm list-certificates --region us-east-1 --certificate-statuses ISSUED \
            --query "CertificateSummaryList[?DomainName=='themondayafter.capstoneglobaladvisory.com'].CertificateArn | [0]" --output text)
          if [ "$arn" = "None" ]; then arn=""; fi
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          if [ -n "$arn" ]; then echo "Certificate found: using the site's own address."; else echo "No issued certificate yet: keeping the temporary address."; fi

      - name: Deploy
        working-directory: infra
        env:
          CERT_ARN: ${{ steps.cert.outputs.arn }}
        run: |
          extra=""
          if [ -n "$CERT_ARN" ]; then extra="-c certificateArn=$CERT_ARN"; fi
          npx cdk deploy TheMondayAfter-email TheMondayAfter-test --require-approval never --outputs-file outputs.json $extra

      - name: Show the address
        run: |
          node -e '
            const all = require("./infra/outputs.json");
            const o = all["TheMondayAfter-test"];
            console.log("## Test copy deployed\n");
            console.log("- Site: " + o.SiteAddress);
            console.log("- Sign-up page: " + o.SignUpPage);
            if (o.WebAddressRecord) {
              const [type, host, value] = o.WebAddressRecord.split(" | ");
              console.log("\n## Web address: add this record in Squarespace (skip if already added)\n");
              console.log("| Type | Host | Value |\n|---|---|---|\n| `" + type + "` | `" + host + "` | `" + value + "` |");
            }
            const dns = Object.entries(all["TheMondayAfter-email"] || {}).filter(([k]) => k.startsWith("DnsRecord")).sort();
            if (dns.length) {
              console.log("\n## DNS records to add in Squarespace (new records only)\n");
              console.log("| Type | Host | Value | Priority |\n|---|---|---|---|");
              for (const [, v] of dns) console.log("| " + v.split(" | ").map((x) => "`" + x + "`").join(" | ").replace(/``/g, "") + " |");
            }
          ' >> "$GITHUB_STEP_SUMMARY"
